# Painel da demonstração: uma única porta (8080) para tudo.
#   /            página do painel (arquivos estáticos)
#   /api/        painel-api (controle dos enlaces no Toxiproxy)
#   /mqtt/...    WebSocket de cada broker (visualização fora de banda)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://painel-api:8000;
    }

    location = /mqtt/a {
        proxy_pass http://fog-a-broker:9001/;
        include /etc/nginx/websocket.conf;
    }

    location = /mqtt/b {
        proxy_pass http://fog-b-broker:9001/;
        include /etc/nginx/websocket.conf;
    }

}
