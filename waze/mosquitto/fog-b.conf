# Broker MQTT do fog da região B (datacenter regional)

# Listener MQTT: celulares (via Toxiproxy), processador (localhost) e
# instrumentação da simulação (rede de gerência).
listener 1883
protocol mqtt

# Listener WebSocket para o painel no navegador (visualização fora de banda).
listener 9001
protocol websockets

# Demonstração didática: sem autenticação.
# Em produção: autenticação de cada celular, ACLs por tópico e TLS.
allow_anonymous true

log_dest stdout
log_type error
log_type warning
log_type notice
