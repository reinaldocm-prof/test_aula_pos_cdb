# Broker MQTT do gateway da linha 1 (fog, nível inferior)

# Listener MQTT para as máquinas da linha (dentro da rede_linha1).
listener 1883
protocol mqtt

# Listener WebSocket para o painel no navegador (visualização fora de banda).
listener 9001
protocol websockets

# Demonstração didática: sem autenticação.
# Em produção: usuários, senhas, ACLs por tópico e TLS.
allow_anonymous true

# Tamanho da fila de mensagens QoS 1 por cliente, INCLUSIVE a da bridge.
# Quando o enlace com o servidor cai, os resumos e alertas esperam aqui.
# O buffer é finito: numa queda longa, o que acontece com o excesso?
# (com janela de 5 s, 200 resumos ~ 16 minutos de queda)
max_queued_messages 200

log_dest stdout
log_type error
log_type warning
log_type notice

# -----------------------------------------------------------------------------
# BRIDGE: gateway da linha 1  <->  servidor da fábrica
# -----------------------------------------------------------------------------
# A bridge é um cliente MQTT dentro deste broker que se conecta ao broker do
# servidor e repassa tópicos nos dois sentidos. É um padrão de mercado para
# ligar níveis de uma hierarquia fog.
connection ponte-servidor-fabrica
# Passa pelo Toxiproxy: é ele que simula a LAN (latência, quedas).
address toxiproxy:21883
remote_clientid gateway-linha1-ponte

# Só o prefixo fabrica/linha1/ atravessa a bridge, nos dois sentidos:
#   sobem  fabrica/linha1/resumo e fabrica/linha1/alerta
#   desce  fabrica/linha1/comando
# A telemetria bruta (linha1/...) NUNCA sai da linha.
topic fabrica/linha1/# both 1

# Sessão persistente + QoS 1: se o enlace cair, as mensagens ficam na fila
# da bridge e são entregues quando ele voltar (store-and-forward da linha).
cleansession false

# Tenta reconectar rapidamente quando o enlace volta.
restart_timeout 2
