# Broker MQTT do servidor da fábrica (fog, nível superior)
# Recebe as bridges dos gateways das linhas.

# Listener MQTT: gateways (via bridge) e o coordenador (localhost).
listener 1883
protocol mqtt

# Listener WebSocket para o painel no navegador (visualização fora de banda).
listener 9001
protocol websockets

# Demonstração didática: sem autenticação.
# Em produção: usuários, senhas, ACLs por tópico e TLS.
allow_anonymous true

log_dest stdout
log_type error
log_type warning
log_type notice
